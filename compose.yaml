name: appweb

services:
  app:
    build: .
    ports:
      - "127.0.0.1:8080:8000"
    environment:
      GREETING: "Hello from Compose!"
      STORAGE: "redis"
      REDIS_URL: "redis://redis:6379/0"
    volumes:
      - appweb_volume:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s


  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - appweb_volume:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

volumes:
  appweb_volume:
